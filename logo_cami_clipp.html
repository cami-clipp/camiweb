<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Logo — cami.clipp</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#e8e8e8;
  font-family:'DM Sans',sans-serif;
  padding:60px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:32px;
}
h2 { font-size:13px; letter-spacing:0.2em; text-transform:uppercase; color:#999; font-weight:400; }

/* Preview area */
.preview-area {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:40px;
  width:100%;
}
.variant { display:flex; flex-direction:column; align-items:center; gap:16px; }
.variant-label { font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#aaa; }

/* Transparent bg check pattern */
.bg-transparent {
  background-image: linear-gradient(45deg,#ccc 25%,transparent 25%),
    linear-gradient(-45deg,#ccc 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ccc 75%),
    linear-gradient(-45deg,transparent 75%,#ccc 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0px;
  padding:40px 60px;
  border-radius:12px;
}
.bg-white { background:#fff; padding:40px 60px; border-radius:12px; }
.bg-dark { background:#2B1F1A; padding:40px 60px; border-radius:12px; }

/* THE LOGO */
.logo-text {
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:64px;
  line-height:1;
  letter-spacing:-0.02em;
  white-space:nowrap;
}
.logo-text .cami { color:#2B1F1A; }
.logo-text .dot-clipp { color:#C4683A; }

/* Dark version: cami in white */
.logo-dark .cami { color:#ffffff; }
.logo-dark .dot-clipp { color:#C4683A; }

/* Buttons */
.btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.btn {
  background:#C4683A; color:white; border:none;
  padding:12px 26px; border-radius:50px; font-size:13px;
  font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif;
  box-shadow:0 4px 14px rgba(196,104,58,0.35);
}
.btn-outline {
  background:white; color:#2B1F1A;
  border:1.5px solid #ddd; padding:12px 26px;
  border-radius:50px; font-size:13px; font-weight:600;
  cursor:pointer; font-family:'DM Sans',sans-serif;
}

/* Hidden render targets for export */
.export-wrap {
  position:fixed; left:-9999px; top:0;
  display:flex; align-items:center; justify-content:center;
}
#export-transparent {
  background:transparent;
  padding:30px 50px;
}
#export-white {
  background:#ffffff;
  padding:30px 50px;
}
#export-dark {
  background:#2B1F1A;
  padding:30px 50px;
}
.export-logo {
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:80px;
  line-height:1;
  letter-spacing:-0.02em;
  white-space:nowrap;
}
</style>
</head>
<body>

<h2>Logo cami.clipp — exportar</h2>

<div class="preview-area">

  <div class="variant">
    <span class="variant-label">Sobre fondo transparente</span>
    <div class="bg-transparent">
      <p class="logo-text"><span class="cami">cami</span><span class="dot-clipp">.clipp</span></p>
    </div>
  </div>

  <div class="variant">
    <span class="variant-label">Sobre blanco</span>
    <div class="bg-white">
      <p class="logo-text"><span class="cami">cami</span><span class="dot-clipp">.clipp</span></p>
    </div>
  </div>

  <div class="variant">
    <span class="variant-label">Sobre oscuro</span>
    <div class="bg-dark">
      <p class="logo-text logo-dark"><span class="cami">cami</span><span class="dot-clipp">.clipp</span></p>
    </div>
  </div>

</div>

<!-- Hidden export targets -->
<div class="export-wrap">
  <div id="export-transparent">
    <p class="export-logo"><span style="color:#2B1F1A">cami</span><span style="color:#C4683A">.clipp</span></p>
  </div>
</div>
<div class="export-wrap">
  <div id="export-white">
    <p class="export-logo"><span style="color:#2B1F1A">cami</span><span style="color:#C4683A">.clipp</span></p>
  </div>
</div>
<div class="export-wrap">
  <div id="export-dark">
    <p class="export-logo"><span style="color:#ffffff">cami</span><span style="color:#C4683A">.clipp</span></p>
  </div>
</div>

<div class="btns">
  <button class="btn" onclick="dl('export-transparent','logo_camiclipp_transparente.png',true)">PNG sin fondo</button>
  <button class="btn-outline" onclick="dl('export-white','logo_camiclipp_blanco.png',false)">PNG fondo blanco</button>
  <button class="btn-outline" onclick="dl('export-dark','logo_camiclipp_oscuro.png',false)">PNG fondo oscuro</button>
  <button class="btn-outline" onclick="dlSVG()">SVG</button>
</div>

<script>
function dl(id, filename, transparent){
  const el = document.getElementById(id);
  html2canvas(el, {
    scale: 4,
    useCORS: true,
    allowTaint: true,
    backgroundColor: transparent ? null : undefined,
    logging: false
  }).then(c => {
    const a = document.createElement("a");
    a.download = filename;
    a.href = c.toDataURL("image/png");
    a.click();
  });
}

function dlSVG(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
    </style>
  </defs>
  <text x="10" y="72" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="72" fill="#2B1F1A" letter-spacing="-1">cami</text>
  <text x="175" y="72" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="72" fill="#C4683A" letter-spacing="-1">.clipp</text>
</svg>`;
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const a = document.createElement("a");
  a.download = "logo_camiclipp.svg";
  a.href = URL.createObjectURL(blob);
  a.click();
}
</script>
</body>
</html>
