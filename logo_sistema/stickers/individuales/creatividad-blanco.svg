<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
<defs>
  <filter id="rough">
    <feTurbulence type="turbulence" baseFrequency="0.018" numOctaves="4" seed="9" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<g filter="url(#rough)">

  <!-- Bombilla grande con cerebro adentro -->
  <!-- Vidrio de la bombilla -->
  <path d="M250,80 Q330,80 358,148 Q378,198 365,252 Q352,292 332,315 Q318,332 315,358 L185,358 Q182,332 168,315 Q148,292 135,252 Q122,198 142,148 Q170,80 250,80 Z"
    fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base bombilla -->
  <rect x="185" y="358" width="130" height="20" rx="5" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="193" y="378" width="114" height="16" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
  <rect x="200" y="394" width="100" height="16" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>

  <!-- Cerebro dentro de la bombilla — lóbulos orgánicos -->
  <path d="M190,230 Q188,200 205,185 Q220,170 240,178 Q250,160 268,162 Q286,164 292,182 Q310,175 322,192 Q334,210 325,232 Q340,248 332,268 Q322,288 305,288 Q295,305 275,308 Q255,312 235,308 Q215,305 205,288 Q188,285 182,265 Q176,245 190,230 Z"
    fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Surcos del cerebro -->
  <path d="M215,195 Q225,188 238,195 Q248,202 245,218" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M268,185 Q282,192 288,208 Q292,222 282,232" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M195,248 Q205,238 218,242 Q228,246 228,260 Q228,272 218,278" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M300,245 Q312,255 308,270 Q304,282 292,285" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Surco divisorio central -->
  <path d="M250,165 Q248,195 250,225 Q252,255 250,285" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,4"/>

  <!-- Destellos arena alrededor de la bombilla -->
  <!-- Arriba -->
  <line x1="250" y1="62" x2="250" y2="38" stroke="#E8D8C0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arriba derecha -->
  <line x1="308" y1="80" x2="326" y2="62" stroke="#E8D8C0" stroke-width="3" stroke-linecap="round"/>
  <!-- Derecha -->
  <line x1="372" y1="180" x2="398" y2="174" stroke="#E8D8C0" stroke-width="3" stroke-linecap="round"/>
  <!-- Abajo derecha -->
  <line x1="355" y1="305" x2="374" y2="320" stroke="#E8D8C0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Izquierda -->
  <line x1="128" y1="180" x2="102" y2="174" stroke="#E8D8C0" stroke-width="3" stroke-linecap="round"/>
  <!-- Arriba izquierda -->
  <line x1="192" y1="80" x2="174" y2="62" stroke="#E8D8C0" stroke-width="3" stroke-linecap="round"/>
  <!-- Abajo izquierda -->
  <line x1="145" y1="305" x2="126" y2="320" stroke="#E8D8C0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pequeños asteriscos -->
  <line x1="375" y1="130" x2="385" y2="120" stroke="#E8D8C0" stroke-width="2" stroke-linecap="round"/>
  <line x1="375" y1="120" x2="385" y2="130" stroke="#E8D8C0" stroke-width="2" stroke-linecap="round"/>
  <line x1="371" y1="125" x2="389" y2="125" stroke="#E8D8C0" stroke-width="2" stroke-linecap="round"/>

  <line x1="115" y1="130" x2="105" y2="120" stroke="#E8D8C0" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="120" x2="105" y2="130" stroke="#E8D8C0" stroke-width="2" stroke-linecap="round"/>
  <line x1="119" y1="125" x2="101" y2="125" stroke="#E8D8C0" stroke-width="2" stroke-linecap="round"/>

  <!-- Tramado interior base -->
  <line x1="198" y1="370" x2="198" y2="408" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>
  <line x1="212" y1="370" x2="212" y2="408" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>
  <line x1="226" y1="370" x2="226" y2="408" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>
  <line x1="240" y1="370" x2="240" y2="408" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>
  <line x1="254" y1="370" x2="254" y2="408" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>
  <line x1="268" y1="370" x2="268" y2="408" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>
  <line x1="282" y1="370" x2="282" y2="408" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>
  <line x1="296" y1="370" x2="296" y2="408" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>

</g>
</svg>
