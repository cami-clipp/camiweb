  <!-- Punta del pincel -->
  <path d="M270,60 Q265,50 272,44 Q279,38 284,48 L308,175"
    fill="#2B1F1A" stroke="#2B1F1A" stroke-width="2"/>
  <!-- Punta con color -->
  <path d="M278,52 Q280,44 284,48 Q286,56 282,62 Z" fill="#C4A882"/>
  <!-- Borde pincel / virola -->
  <rect x="296" y="155" width="22" height="12" rx="3" fill="none" stroke="#2B1F1A" stroke-width="3" transform="rotate(18 296 155)"/>

  <!-- Trazos creativos saliendo del pincel -->
  <path d="M255,85 Q230,60 215,72 Q200,84 212,100" fill="none" stroke="#C4A882" stroke-width="3" stroke-linecap="round"/>
  <path d="M245,70 Q235,40 220,48" fill="none" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M262,78 Q248,50 258,35 Q268,20 278,32" fill="none" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M278,70 Q300,48 315,58 Q328,68 318,82" fill="none" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Asteriscos y destellos creativos -->
  <line x1="195" y1="85" x2="205" y2="75" stroke="#2B1F1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="195" y1="75" x2="205" y2="85" stroke="#2B1F1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="191" y1="80" x2="209" y2="80" stroke="#2B1F1A" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="328" y1="92" x2="338" y2="82" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="328" y1="82" x2="338" y2="92" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="324" y1="87" x2="342" y2="87" stroke="#C4A882" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tramado en palma -->
  <line x1="205" y1="295" x2="215" y2="348" stroke="#2B1F1A" stroke-width="1.2" opacity="0.3"/>
  <line x1="220" y1="298" x2="228" y2="352" stroke="#2B1F1A" stroke-width="1.2" opacity="0.3"/>
  <line x1="235" y1="300" x2="242" y2="355" stroke="#2B1F1A" stroke-width="1.2" opacity="0.3"/>
  <line x1="250" y1="300" x2="256" y2="355" stroke="#2B1F1A" stroke-width="1.2" opacity="0.3"/>
  <line x1="265" y1="298" x2="270" y2="352" stroke="#2B1F1A" stroke-width="1.2" opacity="0.3"/>
  <line x1="280" y1="295" x2="284" y2="342" stroke="#2B1F1A" stroke-width="1.2" opacity="0.3"/>

