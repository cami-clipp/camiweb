  <path d="M185,320 Q170,295 172,265 Q174,240 188,228 Q200,218 215,225 Q222,210 238,208 Q255,206 262,220 Q275,210 290,215 Q305,220 308,238 Q320,232 332,240 Q345,250 340,268 Q338,285 325,292 Q318,320 305,338 Q290,355 268,362 Q245,368 222,358 Q200,348 185,320 Z"
    fill="none" stroke="#2B1F1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dedos -->
  <!-- Índice levantado sosteniendo -->
  <path d="M262,220 Q258,185 255,155 Q253,130 262,118 Q272,106 284,112 Q296,118 295,145 Q294,172 290,215"
    fill="none" stroke="#2B1F1A" stroke-width="4" stroke-linecap="round"/>
  <!-- Dedo medio -->
  <path d="M238,208 Q235,172 234,142 Q233,115 244,105 Q255,95 266,102 Q277,109 276,138 Q275,165 262,220"
